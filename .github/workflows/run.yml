name: run

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: sudo apt-get install -y graphviz
      - run: pip install -r requirements.txt
      - name: Execute the notebook top to bottom
        run: jupyter nbconvert --to notebook --execute customer_segmentation.ipynb --output executed.ipynb --ExecutePreprocessor.timeout=3600
      - uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: executed.ipynb
